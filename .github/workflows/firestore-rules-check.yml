name: Testes de segurança — Firestore
on:
  push:
    paths:
      - 'firestore.rules'
      - 'firebase.json'
      - 'tests/firestore-rules.test.mjs'
      - '.github/workflows/firestore-rules-check.yml'
  pull_request:
    paths:
      - 'firestore.rules'
      - 'firebase.json'
      - 'tests/firestore-rules.test.mjs'
      - '.github/workflows/firestore-rules-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regras:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Instalar dependências isoladas do teste
        run: npm install --no-save @firebase/rules-unit-testing@3.0.4 firebase@10.12.2 firebase-tools@15.34.1
      - name: Testar regras no emulador Firestore
        run: npx firebase-tools emulators:exec --only firestore --project demo-sisdifi --non-interactive "node tests/firestore-rules.test.mjs"
