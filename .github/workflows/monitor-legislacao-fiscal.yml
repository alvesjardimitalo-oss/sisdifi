name: SISDIFI — Atualizador de legislação fiscal
on:
  push:
    branches: [main]
    paths:
      - 'scripts/monitor-legislacao-fiscal.py'
      - '.github/workflows/monitor-legislacao-fiscal.yml'
  schedule:
    - cron: '17 10 * * *' # Diário, 07h17 em Minas Gerais (UTC-3)
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  issues: write
concurrency:
  group: legislacao-fiscal
  cancel-in-progress: false
jobs:
  monitorar:
    runs-on: ubuntu-latest
    steps:
      - name: Código atualizado
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Consultar legislação oficial
        id: verificar
        run: python3 scripts/monitor-legislacao-fiscal.py
      - name: Abrir PR com o resultado do monitoramento
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(fiscal): atualizar consulta das fontes oficiais"
          branch: bot/monitor-legislacao-fiscal
          delete-branch: true
          add-paths: assets/data/legislacao-fiscal.json
          title: "Monitoramento fiscal: atualizar catálogo de fontes oficiais"
          body: |
            Atualização automática do catálogo de fontes públicas.
            
            **Atenção:** diferença de conteúdo não comprova mudança de norma, alíquota ou vigência. A Contabilidade deve conferir a publicação oficial e registrar a validação antes de alterar parâmetros.
            
            Este PR não altera alíquotas nem regras de cálculo.
      - name: Abrir alerta para revisão de mudança detectada
        if: steps.verificar.outputs.novos_alertas != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create --title "Conferência fiscal: alteração em fonte oficial detectada" \
            --body "O monitor diário detectou alteração textual ou de arquivo em fonte oficial. Verifique a lista em assets/data/legislacao-fiscal.json, compare o texto e a vigência da norma, e confirme com Tributos/Contabilidade se a alteração afeta IRRF, ISS, INSS ou CBS/IBS. Não altere alíquotas automaticamente. As análises do SISDIFI mostram revisão pendente enquanto não houver validação."
