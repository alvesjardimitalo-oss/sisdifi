name: Publicar regras do Firestore SISDIFI
# O deploy de produção é manual e só pode ser executado a partir da main.
# Merge de PR ou alteração de rules não publica nada automaticamente.
on:
  # Deploy de produção é sempre deliberado; merge de PR não publica regras automaticamente.
  workflow_dispatch:
jobs:
  publicar:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/audit/correcao-seguranca-integridade'
    runs-on: ubuntu-24.04
    concurrency:
      group: sisdifi-firestore-rules-production
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Conferir conta de serviço configurada
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SISDIFI }}
        run: |
          if [ -z "$FIREBASE_SA" ]; then
            echo "::error::Falta o segredo FIREBASE_SERVICE_ACCOUNT_SISDIFI. Cadastre a chave da conta de serviço em Settings > Secrets and variables > Actions."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preparar Java para o emulador Firestore
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Instalar dependências isoladas dos testes de regras
        run: npm install --no-save @firebase/rules-unit-testing@3.0.4 firebase@10.12.2 firebase-tools@15.34.1
      - name: Validar regras no emulador antes do deploy
        run: npx firebase-tools emulators:exec --only firestore --project demo-sisdifi --non-interactive "node tests/firestore-rules.test.mjs"
      - name: Autenticar no Firebase (conta de serviço)
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SISDIFI }}
      # O deploy compila as regras antes de publicar: regras com erro são recusadas e nada muda.
      - name: Publicar somente as regras do Firestore
        run: npx --yes firebase-tools@15.34.1 deploy --only firestore:rules --project sisdifi --non-interactive
